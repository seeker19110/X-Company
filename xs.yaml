# xs.yaml — lệnh chuẩn của repo này cho agent, hook và CI (YAML phẳng `task: lệnh`, đọc bởi scripts/dev-task.sh).
# CI job `quality` chạy `scripts/dev-task.sh gate` = build → typecheck → lint → test bằng ĐÚNG các lệnh dưới đây.
# Công cụ ghim kèm hash: requirements-dev.txt (ruff 0.17.0, mypy 2.4.0, coverage 7.16.2 — xác minh PyPI 2026-10-14); shellcheck (CI: ubuntu-latest). Agent KHÔNG suy diễn lệnh từ văn xuôi.
format: python3 -m ruff format scripts tests .claude/hooks
format_file: python3 -m ruff format {}
lint: python3 scripts/xs.py validate && python3 scripts/check-links.py && python3 scripts/xs.py progress-check && python3 scripts/xs.py changelog-check && python3 scripts/xs.py ci-check && python3 -m ruff check scripts tests .claude/hooks && python3 -m ruff format --check scripts tests .claude/hooks && for f in scripts/*.sh .claude/hooks/*.sh; do bash -n "$f" || exit 1; done && shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh && python3 -m json.tool .claude/settings.json >/dev/null && python3 -m json.tool .github/rulesets/main.json >/dev/null
typecheck: python3 -m mypy --strict --python-version 3.11 scripts/xs.py scripts/install.py scripts/check-links.py .claude/hooks/guard.py
test: d="$(mktemp -d)" && export COVERAGE_FILE="$d/.coverage" && python3 -m coverage erase && python3 -m coverage run -m unittest discover -s tests && python3 -m coverage combine -q && python3 -m coverage report --fail-under=100; rc=$?; rm -rf "$d"; exit $rc
build: python3 scripts/xs.py stats
