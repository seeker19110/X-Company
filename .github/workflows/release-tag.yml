name: Release tag

# Tạo annotated tag `v<VERSION>` trên `main` (BASE-REPO-006). Chạy tay (workflow_dispatch) — phát hành là quyết định của người.
# Lý do có workflow: phiên agent bị proxy chặn push tag; tag tạo ở đây vẫn là annotated (`git cat-file -t` = `tag`).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit trên main để gắn tag (để trống = đầu main). Phải là tổ tiên của main và có VERSION/CHANGELOG khớp."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tạo và đẩy annotated tag từ VERSION
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          target=$(git rev-parse --verify "${INPUT_SHA:-$GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$target" "$GITHUB_SHA" || { echo "::error::$target không thuộc lịch sử main"; exit 1; }
          v=$(git show "$target:VERSION" | tr -d '[:space:]')
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION không phải SemVer: $v"; exit 1; }
          git show "$target:CHANGELOG.md" | grep -q "^## \[$v\]" || { echo "::error::CHANGELOG.md tại $target thiếu mục ## [$v]"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::Tag v$v đã tồn tại"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "v$v" "$target"
          test "$(git cat-file -t "v$v")" = tag
          git push origin "refs/tags/v$v"
          echo "OK — annotated tag v$v → $target"
