name: Secret scan

# Luật "bí mật KHÔNG bao giờ vào Git" (01-baseline/security-minimum, 12-security/secrets-management):
# gitleaks quét TOÀN BỘ lịch sử (fetch-depth 0) trên push và PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gitleaks-action đọc danh sách commit của PR qua API → cần pull-requests: read (thiếu → 403).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo cá nhân/public miễn phí; repo tổ chức cần GITLEAKS_LICENSE.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
