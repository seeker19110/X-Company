name: Portability

# Hook và script được dự án đích chạy trên máy dev: macOS dùng bash 3.2 + sed/awk BSD.
# Chạy test hook/installer với /bin/bash của macOS để chặn cú pháp chỉ có ở bash 4+/GNU (vd mapfile, sed '\n').
on:
  pull_request:
    branches: [main]
    paths: [".claude/hooks/**", "scripts/**", "tests/**", ".github/workflows/portability.yml"]
  push:
    branches: [main]
    paths: [".claude/hooks/**", "scripts/**", "tests/**", ".github/workflows/portability.yml"]

permissions:
  contents: read

jobs:
  macos-bash32:
    name: macos-bash32
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Test hook + installer với /bin/bash (3.2) đứng đầu PATH
        run: |
          PY=$(command -v python3)
          PATH=/bin:/usr/bin:$PATH bash --version | head -1
          PATH=/bin:/usr/bin:$PATH "$PY" -m unittest tests.test_hooks tests.test_install -v
