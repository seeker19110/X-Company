name: Maintenance

# Việc định kỳ hằng tuần: EOL runtime/CSDL (OPS-MAINT-003, BASE-DEP-003), link ngoài (BASE-DOC-006, WF-DOC-002),
# gitleaks toàn lịch sử (SEC-SECRET-001, WF-GIT-010).
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eol-check:
    name: eol-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Đối chiếu endoflife.date (đỏ khi đã EOL hoặc còn < 90 ngày)
        run: node scripts/eol-check.mjs --strict

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - name: Link ngoài trong tài liệu (cache, retry; chỉ cảnh báo)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml './**/*.md'
          fail: false
      - name: Mở/cập nhật issue khi có link chết
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          title="Link ngoài hỏng trong tài liệu (lychee hằng tuần)"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file lychee/out.md
          else gh issue create --title "$title" --body-file lychee/out.md; fi
