name: Dependency audit

# Quét lỗ hổng phụ thuộc Python (BASE-DEP-004): mỗi PR, push main, hằng tuần và chạy tay.
# Khung chỉ dùng thư viện chuẩn lúc chạy; các gói ở đây là công cụ cổng (requirements-dev.txt) và chính pip-audit.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cài pip-audit kèm hash
        run: pip install --quiet --require-hashes -r requirements-audit.txt
      - name: Quét lỗ hổng (đỏ khi có lỗ hổng đã biết)
        run: pip-audit --require-hashes --strict --disable-pip -r requirements-dev.txt -r requirements-audit.txt
