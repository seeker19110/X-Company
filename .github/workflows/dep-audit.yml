name: Dependency audit

# Lỗ hổng đã biết trong phụ thuộc production (npm audit --omit=dev). Phụ thuộc dev được theo dõi qua Dependabot;
# ngoại lệ hiện có: braces (GHSA-vfj7-8cjw-p6xm) chỉ trong chuỗi eslint-config-next, mọi phiên bản, chưa có bản sửa — D-008.
# Trên PR/push `main`, cùng lệnh chạy ở job `dep-audit` của ci.yml (job con của `quality` — khung 3.12.0); file này chỉ còn
# lịch tuần (lỗ hổng mới công bố khi không có commit) và chạy tay.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
      - name: Quét lỗ hổng phụ thuộc production (đỏ khi ≥ moderate)
        run: npm audit --omit=dev --audit-level=moderate
