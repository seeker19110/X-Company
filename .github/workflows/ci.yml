  # Required check `quality` (ruleset `.github/rulesets/main.json`): job TỔNG HỢP của MỌI job ở trên (WF-CI-001, khung 3.12.0).
  # `always()` — không phải `!cancelled()`: run bị huỷ thì `quality` vẫn chạy và ĐỎ (job con `cancelled`/`skipped` ≠ `success`);
  # `skipped` của required check được GitHub tính là ĐẠT nên không được để `quality` thành `skipped`.
  quality:
    name: quality
    needs:
      [
        typecheck,
        lint,
        build,
        checks,
        test,
        coverage,
        dep-audit,
        e2e,
        readme-smoke,
        protection-guard,
        supply-chain,
        lighthouse,
        dast,
        dast-probes,
        ops-stack,
        staging-tls,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi job con phải `success`
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: v.get("result") for job, v in needs.items() if v.get("result") != "success"}
          for job, v in sorted(needs.items()):
              print(f"{job}={v.get('result')}")
          if not needs or bad:
              print(f"::error::Job con không `success`: {bad or 'không có job con nào'}")
              sys.exit(1)
          PY
