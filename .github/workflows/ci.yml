name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Khung 3.12.0 (ADR-0034, WF-CI-024/025): job `quality` cũ chạy nối tiếp 8m02s (đường găng của CI) — typecheck+lint chạy hai
  # lần (bước riêng + trong `dev-task.sh gate`), rồi coverage chạy lại cả bộ test. Tách thành job chạy CÙNG LÚC, mỗi job đúng
  # lệnh của xt.yaml qua dev-task.sh; `quality` nay là job TỔNG HỢP (cuối file) `needs` mọi job — required check duy nhất của
  # ci.yml. Test không đọc sản phẩm build (`.next`) nên tách build/test không làm test nào tự bỏ qua.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: typecheck — đúng lệnh trong xt.yaml
        run: .xtemplates/scripts/dev-task.sh typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: lint (gồm format:check) — đúng lệnh trong xt.yaml
        run: .xtemplates/scripts/dev-task.sh lint

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: build — đúng lệnh trong xt.yaml
        run: .xtemplates/scripts/dev-task.sh build

  # Kiểm tĩnh của dự án và khung (nhanh, cần lịch sử để so với nhánh gốc).
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:arch so ADR với nhánh gốc; progress-check cần SHA bàn giao
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Kiến trúc — miền, route, ADR bất biến, test hợp lệ (ARC-MOD, FE-RENDER, QA-COV)
        run: npm run -s check:arch
      - name: Migration append-only, không thao tác phá vỡ (DB-MIG-008, OPS-DEPLOY-003)
        run: npm run -s check:migrations
      - name: Tài liệu — spec/AC, threat model, data map, link nội bộ, tệp dự án (BASE-DOC-006, WF-DOC-002)
        run: |
          npm run -s check:docs
          npm run -s check:repo-docs
      - name: PROGRESS.md hợp lệ, SHA bàn giao có trên nhánh chính (BASE-DOC-008)
        run: python3 .xtemplates/scripts/xt.py progress-check
      - name: Khung — PLAN/blueprint/CI hợp lệ
        run: |
          python3 .xtemplates/scripts/xt.py ci-check .github/workflows
          set -o pipefail
          # AUD-HAR-001: không --strict thì luôn exit 0 (MUST còn mở là hợp lệ) → tự đỏ khi miễn trừ thiếu lý do/dòng hỏng.
          python3 .xtemplates/scripts/xt.py blueprint-status BLUEPRINT.md --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("blueprint: bad_waivers", d["bad_waivers"], "bad_lines", d["bad_lines"]); sys.exit(1 if d["bad_waivers"] or d["bad_lines"] else 0)'

  # `test` và `coverage` chạy cùng bộ test (coverage dưới c8) song song với nhau: `test` là đúng lệnh `test` của xt.yaml
  # (WF-CI-002), `coverage` giữ ngưỡng baseline (QA-COV-002). Cả hai cần Postgres 17 + client 17 + OpenBao/restic thật.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      # pg_dump phải cùng bản chính với máy chủ Postgres 17 của service (test sao lưu/khôi phục, mã hoá, cảnh báo):
      # bản trong image runner cũ hơn → "server version mismatch". Cài client 17 từ kho PGDG chính thức.
      - name: Cài postgresql-client-17 (khớp máy chủ)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # T-052/T-053: test KMS (OpenBao) và off-site (restic) chạy nhị phân THẬT, không skip. Tải bản GHIM phiên bản + sha256 vào .tools/
      # (scripts/tools/install-tool.mjs; sai sha256 → dừng). Không cache để không thêm action chưa ghim SHA; ~85 MB mỗi lần chạy.
      - name: Cài OpenBao + restic (ghim sha256) cho test KMS/off-site
        run: node scripts/tools/install-tool.mjs install openbao restic
      - name: test — đúng lệnh trong xt.yaml
        run: .xtemplates/scripts/dev-task.sh test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:coverage-baseline so .c8rc.json với nhánh gốc
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Cài postgresql-client-17 (khớp máy chủ)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Cài OpenBao + restic (ghim sha256) cho test KMS/off-site
        run: node scripts/tools/install-tool.mjs install openbao restic
      - name: Coverage theo baseline (.c8rc.json chỉ tăng — QA-COV-002)
        run: |
          npm run -s check:coverage-baseline
          npm run -s coverage
      - name: Lưu báo cáo coverage (QA-COV-001)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # Lỗ hổng phụ thuộc production trên mọi PR/push (trước ở dep-audit.yml như required check riêng; dep-audit.yml nay chỉ
  # còn lịch tuần) — job con của `quality` để ruleset chỉ giữ check tối thiểu (khung 3.12.0, D-116).
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
      - name: Quét lỗ hổng phụ thuộc production (đỏ khi ≥ moderate)
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Cài Chromium đúng phiên bản Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: E2E đầy đủ (Postgres thật + bản build production, axe WCAG 2.2 AA)
        run: npm run -s e2e
      - name: Lưu báo cáo + trace Playwright khi đỏ (QA-E2E-005)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  readme-smoke:
    name: readme-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BASE-DOC-005, XC-DX-001: chạy đúng các lệnh "Bắt đầu nhanh" của README trên clone sạch (Postgres có sẵn của runner).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: PostgreSQL của runner vào PATH (initdb/pg_ctl cho scripts/with-test-db.sh)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      # `npm test` của README gồm test KMS/off-site chạy nhị phân thật (không skip): cài bản ghim sha256 như job quality.
      - name: Cài OpenBao + restic (ghim sha256) cho test KMS/off-site
        run: node scripts/tools/install-tool.mjs install openbao restic
      - name: Lệnh trong README (trích tự động, chạy nguyên văn)
        run: node scripts/readme-smoke.mjs

  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required check trong ruleset ↔ job có thật
        run: |
          set -euo pipefail
          jobs=$(python3 - <<'PY'
          import glob, re
          names = set()
          for f in glob.glob(".github/workflows/*.yml"):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r"^jobs:\n(.*)", txt, re.S | re.M)
              if not m: continue
              for jm in re.finditer(r"^  ([A-Za-z0-9_-]+):\n((?:    .*\n|\n)*)", m.group(1), re.M):
                  key, body = jm.group(1), jm.group(2)
                  nm = re.search(r"^    name:\s*(.+?)\s*$", body, re.M)
                  names.add(nm.group(1).strip('"\'') if nm else key)
          print("\n".join(sorted(names)))
          PY
          )
          fail=0
          for c in $(python3 -c "import json;[print(x['context']) for r in json.load(open('.github/rulesets/main.json'))['rules'] if r['type']=='required_status_checks' for x in r['parameters']['required_status_checks']]"); do
            grep -qx "$c" <<<"$jobs" || { echo "::error::Required check '$c' không khớp job nào trong .github/workflows/"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK — mọi required check đều là job có thật."
          exit $fail
      - name: Ruleset trên nhánh mặc định đang hiệu lực? (cảnh báo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          rules=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH" || echo "[]")
          for t in pull_request required_status_checks deletion non_fast_forward; do
            if ! python3 -c "import json,sys; r=json.loads(sys.argv[1]); sys.exit(0 if any(x.get('type')==sys.argv[2] for x in r) else 1)" "$rules" "$t"; then
              echo "::warning::Nhánh $BRANCH chưa có rule '$t' — import .github/rulesets/main.json (Settings → Rules → Rulesets → Import)."
            fi
          done
          echo "Đã kiểm ruleset (cảnh báo nếu thiếu)."

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CMP-LIC-001/002/003, BASE-DEP-005, SEC-SUPPLY-006: license, ngoại lệ OSV còn hạn, SBOM, THIRD_PARTY_NOTICES, nối dây workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Cổng chuỗi cung ứng (license, hạn ngoại lệ OSV, notices, workflow, ci-check)
        run: npm run -s check:supply-chain
      - name: Sinh lại THIRD_PARTY_NOTICES.md và so với bản commit (CMP-LIC-001)
        run: |
          node scripts/gen-third-party-notices.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: SBOM CycloneDX (production) và kiểm license ≥ 99% (CMP-LIC-003)
        run: node scripts/check-sbom.mjs --out sbom.cdx.json
      - name: Lưu SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FE-PERF-002, FE-PERF-004, XC-PERF-003, PRF-WEB-005: ngân sách bundle + Lighthouse mobile (3 lần, median) trên `next start` với DB seed như e2e.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Build production
        run: npm run -s build
      - name: Ngân sách bundle/request so baseline (đỏ khi vượt — FE-PERF-004, XC-GREEN-002)
        run: PERF_NO_BUILD=1 npm run -s check:perf-budget
      - name: Rule cảnh báo Prometheus — kiểm cấu trúc (OPS-SLO-001, BE-JOB-004)
        run: npm run -s check:alerts
      - name: Cài Chromium đúng phiên bản Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Lighthouse CI (@lhci/cli 0.15.1; assert trong lighthouserc.json)
        run: LH_SKIP_BUILD=1 npm run -s lighthouse
      - name: Lưu báo cáo Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  dast:
    name: dast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # SEC-WEB-001, SEC-WEB-004: OWASP ZAP baseline + quét chủ động giới hạn thời gian trên `next start` với DB seed như e2e.
    # Cổng: scripts/zap-gate.mjs — đỏ khi còn cảnh báo mức Medium trở lên ngoài security/zap/allowlist.json.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
