name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mặc định tối thiểu cho MỌI job (GITHUB_TOKEN chỉ đọc). Job nào cần hơn tự khai ở job-level.
permissions:
  contents: read

jobs:
  # Hàng rào cho CHÍNH bộ khung — chạy CẢ KHI CHƯA có app (không guard package.json).
  # KHUNG-1 nguyên tắc 6: tiêu chuẩn kiểm được bằng máy thì tự động hóa — áp cho chính template:
  # shell phải đúng cú pháp, JSON cấu hình phải hợp lệ. (Kiểm tra link/tên file cũ trong tài
  # liệu đã có job docs-consistency riêng bên dưới — không lặp lại ở đây.)
  # Hàng rào cho CHÍNH hàng rào. Hai vế, vế nào hỏng cũng đỏ:
  #  (1) Ruleset trên nhánh mặc định phải ĐANG có hiệu lực — "đã bật branch protection" trở thành thứ
  #      máy kiểm được, không phải lời khai. Chưa import ruleset thì mọi PR đỏ; đó là chủ đích.
  #  (2) Mọi required status check trong ruleset phải trỏ tới một job CÓ THẬT trong .github/workflows/.
  #      Đây là kiểu hỏng âm thầm và tốn kém nhất: đổi tên một job ⇒ context bắt buộc không bao giờ
  #      xuất hiện ⇒ `main` bị khoá vĩnh viễn mà CI vẫn xanh. Bắt ở PR đổi tên, trước khi nó merge.
  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rule đang áp lên nhánh mặc định phải khớp .github/rulesets/main.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          rules=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH")
          has_rule()  { jq -e --arg t "$1" 'map(select(.type == $t)) | length > 0' <<<"$rules" >/dev/null; }
          fail=0
          for t in pull_request required_status_checks deletion non_fast_forward; do
            has_rule "$t" || { echo "::error::Thiếu rule '$t' trên $BRANCH"; fail=1; }
          done
          live=$(jq -r '[.[] | select(.type == "required_status_checks")
                        | .parameters.required_status_checks[].context] | sort | .[]' <<<"$rules")
          want=$(jq -r '[.rules[] | select(.type == "required_status_checks")
                        | .parameters.required_status_checks[].context] | sort | .[]' .github/rulesets/main.json)
          for c in $want; do
            grep -qx "$c" <<<"$live" || { echo "::error::Status check '$c' chưa được bắt buộc trên $BRANCH"; fail=1; }
          done
          if [ "$fail" = 1 ]; then
            echo "::error::Bảo vệ nhánh CHƯA khớp. Import .github/rulesets/main.json: Settings → Rules → Rulesets → New ruleset → Import a ruleset. Chi tiết: CONTRIBUTING.md."
            exit 1
          fi
          echo "OK — $BRANCH đang được bảo vệ đúng ruleset."

      - name: Mọi required check phải là một job có thật (chặn khoá-nhánh-do-đổi-tên-job)
        run: |
          set -euo pipefail
          jobs=$(python3 - <<'PY'
          import glob, yaml
          names = set()
          for f in glob.glob(".github/workflows/*.yml"):
              d = yaml.safe_load(open(f)) or {}
              for key, cfg in (d.get("jobs") or {}).items():
                  names.add((cfg or {}).get("name") or key)
          print("\n".join(sorted(names)))
          PY
          )
          fail=0
          for c in $(jq -r '.rules[] | select(.type == "required_status_checks")
                            | .parameters.required_status_checks[].context' .github/rulesets/main.json); do
            grep -qx "$c" <<<"$jobs" || {
              echo "::error::Required check '$c' trong ruleset KHÔNG khớp job nào trong .github/workflows/."
              echo "::error::Đổi tên job mà quên sửa ruleset sẽ khoá vĩnh viễn nhánh mặc định. Sửa một trong hai cho khớp."
              fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "OK — mọi required check đều trỏ tới một job có thật."

  framework-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cú pháp shell (bash -n — mọi *.sh + hook husky)
        run: |
          set -e
          find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n
          for f in .husky/pre-commit .husky/commit-msg; do
            if [ -f "$f" ]; then bash -n "$f"; fi
          done
          echo "OK: cú pháp shell sạch"

      - name: ShellCheck (mức error)
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 shellcheck --severity=error

      - name: JSON cấu hình hợp lệ (jq)
        run: |
          set -e
          for f in .claude/settings.json .claude/settings-shared-opusplan.json \
                   .lintstagedrc.json .prettierrc lighthouserc.json; do
            if [ -f "$f" ]; then jq empty "$f" && echo "OK $f"; fi
          done

  # Luôn chạy (không cần package.json) — bắt link gãy / tên file cũ sót lại trong tài liệu
  # của chính repo khung, để không phải rà tay sau mỗi lần đổi tên file.
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/check-docs-consistency.sh

  # Luôn chạy — chạy THẬT copy-framework.sh/.ps1 vào thư mục scratch để xác nhận: copy
  # đúng cấu trúc (Lớp 1 thẳng, Lớp 2 vào _framework-dropins/), KHÔNG đè file đã có ở
  # dự án đích, và chạy lại lần hai không lỗi. ubuntu-latest có sẵn pwsh nên kiểm cả .ps1.
  copy-framework-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/test-copy-framework.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Repo khung (chưa có app) → bỏ qua các bước build/test để CI vẫn xanh.
      # Khi dự án thật được tạo (có package.json), toàn bộ hàng rào tự kích hoạt.
      - name: Kiểm tra đã có ứng dụng chưa
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có package.json — đây là repo khung (template). Bỏ qua build/test; hàng rào sẽ tự chạy khi có dự án thật."
          fi

      # Cổng "sẵn sàng phát triển": dự án thật KHÔNG được còn placeholder [ĐIỀN: ...]
      # trong CLAUDE.md (KHOI-TAO Phần C). Repo khung (chưa có app) được bỏ qua.
      - name: Cổng "không còn [ĐIỀN]" trong CLAUDE.md
        if: steps.app.outputs.exists == 'true'
        run: |
          if grep -q "\[ĐIỀN" CLAUDE.md; then
            echo "::error::CLAUDE.md còn placeholder [ĐIỀN: ...] — điền đầy đủ cho dự án trước khi phát triển."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Quét bảo mật phụ thuộc
        if: steps.app.outputs.exists == 'true'
        run: npm audit --audit-level=high

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint

      - name: Type check
        if: steps.app.outputs.exists == 'true'
        run: npm run type-check

      - name: Kiểm tra format
        if: steps.app.outputs.exists == 'true'
        run: npm run format:check

      # Chạy unit test KÈM ngưỡng coverage (vitest.config.ts) → cổng "có test tối thiểu".
      - name: Test (unit + coverage)
        if: steps.app.outputs.exists == 'true'
        run: npm run test:coverage

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build

  # Cổng E2E: chạy Playwright (desktop + mobile) + quét axe trên app đã build.
  # Đóng đúng cổng GĐ 6 của KHUNG 1: "Toàn bộ test xanh (gồm E2E Playwright)".
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Kiểm tra đã có ứng dụng chưa
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có package.json — bỏ qua E2E; sẽ tự chạy khi có dự án thật."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      # Cả project desktop (Desktop Chrome) lẫn mobile (Pixel 5) đều dùng Chromium.
      # Cache Chromium của Playwright (~/.cache/ms-playwright), khoá theo phiên bản @playwright/test
      # trong package-lock.json: đổi phiên bản là tự miss. Trước đây tải lại mỗi lượt, 29 s/job.
      - name: Cache trình duyệt Playwright
        if: steps.app.outputs.exists == 'true'
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cài trình duyệt Playwright
        if: steps.app.outputs.exists == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache trúng thì chỉ cần gói hệ thống (không tải trình duyệt).
      - name: Cài gói hệ thống cho Chromium (cache trúng)
        if: steps.app.outputs.exists == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build
        env:
          # Đặt biến môi trường cần cho build qua GitHub Secrets, không hard-code.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # playwright.config.ts tự dựng server (`npm run start`) trước khi chạy test.
      - name: E2E (Playwright desktop + mobile + axe)
        if: steps.app.outputs.exists == 'true'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Lưu báo cáo Playwright
        if: ${{ always() && steps.app.outputs.exists == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
