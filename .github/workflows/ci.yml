name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Khung 3.13 (ADR-0039, D-127, D-128): ÍT JOB NHẤT mà không bỏ kiểm nào, SONG SONG TỐI ĐA trong số job đó. Fan-out "mỗi
  # kiểm một job" (3.12.0, ADR-0034) làm 17 job xếp hàng dưới trần job đồng thời của tài khoản (e2e chờ runner 6 phút).
  # Nay: `gate` gom mọi kiểm ngắn (một lần cài phụ thuộc, đúng lệnh cũ, chạy nền song song theo phụ thuộc thật); `test`
  # chạy bộ test MỘT lần dưới c8 (coverage); job dài cần Postgres + bản build production đứng riêng (e2e, dast,
  # lighthouse, readme-smoke) hoặc gộp khi tổng ngắn (`drills`). Không job nào `needs` job khác trừ `quality` (cuối
  # file), job tổng hợp — cùng `gitleaks` là required check duy nhất của ruleset.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:arch so ADR với nhánh gốc; progress-check cần SHA bàn giao
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      # Bước GHI tệp đã commit đứng riêng, TRƯỚC khi chạy song song: `check:supply-chain` (so notices) và `prettier --check`
      # (lint) đọc tệp này — ghi lúc chúng đang đọc là đỏ ngẫu nhiên.
      - name: Sinh lại THIRD_PARTY_NOTICES.md và so với bản commit (CMP-LIC-001)
        run: |
          node scripts/gen-third-party-notices.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.md
      # D-128: các nhóm chạy NỀN cùng lúc, mỗi nhóm một log, chờ từng PID; nhóm nào đỏ thì bước đỏ (sau khi in đủ log).
      # Phụ thuộc thật: `build` ghi `.next/` + `next-env.d.ts`, mà `typecheck` (tsconfig gồm `.next/types`) và `lint`
      # (ESLint type-aware `projectService`) đọc → hai nhóm này chạy SAU build (như `dev-task.sh gate`: build → typecheck
      # → lint). Kiểm tĩnh/chuỗi cung ứng/audit/protection-guard không đọc `.next` (walker bỏ qua `.next`, check:encoding
      # dùng git ls-files) → chạy cùng lúc với build. SBOM ghi `sbom.cdx.json` (gitignore — prettier bỏ qua).
      - name: Kiểm song song — build → (typecheck ∥ lint) ∥ kiểm tĩnh ∥ chuỗi cung ứng + SBOM ∥ dep-audit ∥ protection-guard
        run: |
          set -uo pipefail
          L="$RUNNER_TEMP/gate-logs"
          mkdir -p "$L"
          declare -A PID
          fail=0
          start() { local n="$1"; shift; ( set -euo pipefail; "$@" ) >"$L/$n.log" 2>&1 & PID[$n]=$!; }
          finish() {
            local n="$1" r=0
            wait "${PID[$n]}" || r=$?
            echo "::group::$n (exit $r)"; cat "$L/$n.log"; echo "::endgroup::"
            if [ "$r" != 0 ]; then echo "::error::Nhóm $n đỏ (exit $r) — log ở nhóm $n phía trên"; fail=1; fi
          }
          g_build() { .xtemplates/scripts/dev-task.sh build; }                # build — đúng lệnh trong xt.yaml
          g_typecheck() { .xtemplates/scripts/dev-task.sh typecheck; }        # typecheck — đúng lệnh trong xt.yaml
          g_lint() { .xtemplates/scripts/dev-task.sh lint; }                  # lint (gồm format:check) — đúng lệnh trong xt.yaml
          g_checks() {
            # Kiến trúc — miền, route, ADR bất biến, test hợp lệ (ARC-MOD, FE-RENDER, QA-COV)
            npm run -s check:arch
            # Migration append-only, không thao tác phá vỡ (DB-MIG-008, OPS-DEPLOY-003)
            npm run -s check:migrations
            # Tài liệu — spec/AC, threat model, data map, link nội bộ, tệp dự án (BASE-DOC-006, WF-DOC-002)
            npm run -s check:docs
            npm run -s check:repo-docs
            # PROGRESS.md hợp lệ, SHA bàn giao có trên nhánh chính (BASE-DOC-008)
            python3 .xtemplates/scripts/xt.py progress-check
            # Khung — PLAN/blueprint/CI hợp lệ
            python3 .xtemplates/scripts/xt.py ci-check .github/workflows
            # AUD-HAR-001: không --strict thì luôn exit 0 (MUST còn mở là hợp lệ) → tự đỏ khi miễn trừ thiếu lý do/dòng hỏng.
            python3 .xtemplates/scripts/xt.py blueprint-status BLUEPRINT.md --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("blueprint: bad_waivers", d["bad_waivers"], "bad_lines", d["bad_lines"]); sys.exit(1 if d["bad_waivers"] or d["bad_lines"] else 0)'
          }
          g_supply() {
            # CMP-LIC-001/002/003, BASE-DEP-005, SEC-SUPPLY-006: license, ngoại lệ OSV còn hạn, notices, nối dây workflow, ci-check.
            npm run -s check:supply-chain
            # SBOM CycloneDX (production) và kiểm license ≥ 99% (CMP-LIC-003)
            node scripts/check-sbom.mjs --out sbom.cdx.json
          }
          # Lỗ hổng phụ thuộc production trên mọi PR/push (dep-audit.yml chỉ còn lịch tuần) — đỏ khi ≥ moderate.
          g_audit() { npm audit --omit=dev --audit-level=moderate; }
          g_guard() {
            # WF-GIT-003 (protection-guard): required check trong ruleset ↔ job có thật.
            jobs=$(python3 - <<'PY'
          import glob, re
          names = set()
          for f in glob.glob(".github/workflows/*.yml"):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r"^jobs:\n(.*)", txt, re.S | re.M)
              if not m: continue
              for jm in re.finditer(r"^  ([A-Za-z0-9_-]+):\n((?:    .*\n|\n)*)", m.group(1), re.M):
                  key, body = jm.group(1), jm.group(2)
                  nm = re.search(r"^    name:\s*(.+?)\s*$", body, re.M)
                  names.add(nm.group(1).strip('"\'') if nm else key)
          print("\n".join(sorted(names)))
          PY
            )
            local bad=0
            for c in $(python3 -c "import json;[print(x['context']) for r in json.load(open('.github/rulesets/main.json'))['rules'] if r['type']=='required_status_checks' for x in r['parameters']['required_status_checks']]"); do
              grep -qx "$c" <<<"$jobs" || { echo "::error::Required check '$c' không khớp job nào trong .github/workflows/"; bad=1; }
            done
            [ "$bad" = 0 ] && echo "OK — mọi required check đều là job có thật."
            return $bad
          }
          start build g_build
          start checks g_checks
          start supply-chain g_supply
          start dep-audit g_audit
          start protection-guard g_guard
          finish build
          # Sau build (kể cả khi build đỏ — vẫn chạy để thấy đủ kết quả như khi còn là job riêng).
          start typecheck g_typecheck
          start lint g_lint
          for n in typecheck lint checks supply-chain dep-audit protection-guard; do finish "$n"; done
          exit "$fail"
      - name: Lưu SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      # SEC-SUPPLY-006, BASE-DEP-004: OSV-Scanner trên package-lock.json GỒM phụ thuộc dev — CHẶN PR qua `quality` (D-128;
      # osv-scanner.yml chỉ còn push main + lịch tuần). Hạn ngoại lệ osv-scanner.toml đã kiểm trong check:supply-chain.
      # Action container → không chạy nền được trong bước trên; `!cancelled()` để vẫn quét khi bước song song đỏ.
      - name: Quét lockfile (prod + dev) theo osv-scanner.toml
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
      # Bước có token đứng riêng (không đưa GITHUB_TOKEN vào môi trường của script npm ở bước song song).
      - name: Ruleset trên nhánh mặc định đang hiệu lực? (cảnh báo)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          rules=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH" || echo "[]")
          for t in pull_request required_status_checks deletion non_fast_forward; do
            if ! python3 -c "import json,sys; r=json.loads(sys.argv[1]); sys.exit(0 if any(x.get('type')==sys.argv[2] for x in r) else 1)" "$rules" "$t"; then
              echo "::warning::Nhánh $BRANCH chưa có rule '$t' — import .github/rulesets/main.json (Settings → Rules → Rulesets → Import)."
            fi
          done
          echo "Đã kiểm ruleset (cảnh báo nếu thiếu)."

  # `test`: chạy bộ test MỘT lần. `npm run -s coverage` (khoá `coverage` của xt.yaml) chạy đúng tập test của khoá `test`
  # (`node --import tsx --test --test-concurrency=1` cùng glob) dưới c8 — test đỏ thì c8 trả exit ≠ 0 — và giữ ngưỡng
  # baseline (QA-COV-002). Trước 3.13 `test` và `coverage` là hai job chạy cùng bộ test hai lần. Cần Postgres 17 + client 17
  # + OpenBao/restic thật.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check:coverage-baseline so .c8rc.json với nhánh gốc
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Cài postgresql-client-17 (khớp máy chủ)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Cài OpenBao + restic (ghim sha256) cho test KMS/off-site
        run: node scripts/tools/install-tool.mjs install openbao restic
      - name: Coverage theo baseline (.c8rc.json chỉ tăng — QA-COV-002)
        run: |
          npm run -s check:coverage-baseline
          npm run -s coverage
      - name: Lưu báo cáo coverage (QA-COV-001)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # BASE-DEP-003, PRF-WEB-010: một nguồn phiên bản runtime
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Cài Chromium đúng phiên bản Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: E2E đầy đủ (Postgres thật + bản build production, axe WCAG 2.2 AA)
        run: npm run -s e2e
      - name: Lưu báo cáo + trace Playwright khi đỏ (QA-E2E-005)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  readme-smoke:
    name: readme-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BASE-DOC-005, XC-DX-001: chạy đúng các lệnh "Bắt đầu nhanh" của README trên clone sạch (Postgres có sẵn của runner).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: PostgreSQL của runner vào PATH (initdb/pg_ctl cho scripts/with-test-db.sh)
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      # `npm test` của README gồm test KMS/off-site chạy nhị phân thật (không skip): cài bản ghim sha256 như job quality.
      - name: Cài OpenBao + restic (ghim sha256) cho test KMS/off-site
        run: node scripts/tools/install-tool.mjs install openbao restic
      - name: Lệnh trong README (trích tự động, chạy nguyên văn)
        run: node scripts/readme-smoke.mjs

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FE-PERF-002, FE-PERF-004, XC-PERF-003, PRF-WEB-005: ngân sách bundle + Lighthouse mobile (3 lần, median) trên `next start` với DB seed như e2e.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # AUD-CI-003: không job nào push; không để token trong .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Build production
        run: npm run -s build
      - name: Ngân sách bundle/request so baseline (đỏ khi vượt — FE-PERF-004, XC-GREEN-002)
        run: PERF_NO_BUILD=1 npm run -s check:perf-budget
      - name: Rule cảnh báo Prometheus — kiểm cấu trúc (OPS-SLO-001, BE-JOB-004)
        run: npm run -s check:alerts
      - name: Cài Chromium đúng phiên bản Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Lighthouse CI (@lhci/cli 0.15.1; assert trong lighthouserc.json)
        run: LH_SKIP_BUILD=1 npm run -s lighthouse
      - name: Lưu báo cáo Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  dast:
    name: dast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # SEC-WEB-001, SEC-WEB-004: OWASP ZAP baseline + quét chủ động giới hạn thời gian trên `next start` với DB seed như e2e.
    # Cổng: scripts/zap-gate.mjs — đỏ khi còn cảnh báo mức Medium trở lên ngoài security/zap/allowlist.json.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: Build production
        run: npm run -s build
      - name: DAST — ZAP baseline + quét chủ động, cổng zap-gate
        run: DAST_SKIP_BUILD=1 npm run -s dast
      - name: Lưu báo cáo ZAP (dữ liệu seed giả)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap-out/
          retention-days: 7
          if-no-files-found: ignore

  # `drills`: ba diễn tập ngắn cùng cần Postgres + bản build production (trước là job `dast-probes`, `ops-stack`,
  # `staging-tls`, mỗi job 1,3–1,7 phút). Mỗi diễn tập migrate + seed + build riêng như khi là job riêng; seed-e2e không
  # chạy lại được trên cùng CSDL (email cố định) nên ops-stack/staging-tls dùng CSDL riêng tạo trên cùng service. Cổng
  # app khác nhau (3200/3400/3500). Đỏ ở diễn tập trước không chặn diễn tập sau (`!cancelled()`); job vẫn đỏ.
  # TUẦN TỰ, không chạy nền song song (D-128, đã đọc script): cả ba ghi rồi đọc cùng tệp `e2e/.seed.json` (seed-e2e.ts
  # ghi đường dẫn cố định, prod-harness readSeed đọc lại → diễn tập này đọc công ty của CSDL kia) và cùng `npm run build`
  # vào `.next/`. Cổng không tranh (cố định khác nhau + freePort). Song song hoá cần script nhận đường dẫn seed riêng.
  drills:
    name: drills
    runs-on: ubuntu-latest
    timeout-minutes: 45 # tổng ba job cũ (mỗi job 30) — đo thật 2026-10-21: 1,3–1,7 phút mỗi diễn tập
    # dast-probes — SEC-WEB-004: DAST cục bộ (bộ probe tự viết + Chromium) trên bản build production với Postgres service và DB seed — faithful-fixture, không phải staging.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # BASE-DEP-008: ghim digest; đổi digest khi nâng bản vá (xem docs/ops/VULN-SLA.md)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài phụ thuộc theo lockfile
        run: npm ci
      - name: CSDL riêng cho ops-stack và staging-tls (cùng service Postgres)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE xc_ops' -c 'CREATE DATABASE xc_staging'
      - name: Cài Chromium đúng phiên bản Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: DAST cục bộ (header, cookie, XSS, CSRF, open redirect, rò lỗi, đường dẫn lộ, giới hạn tần suất, BOLA)
        env:
          XC_REPORT_DIR: . # báo cáo ghi vào repo để upload artifact ở bước sau (mặc định ra thư mục tạm)
        run: npm run -s dast:probes
      - name: Lưu báo cáo DAST
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-report
          path: |
            docs/security/dast-report.md
            docs/security/dast-report.json
          retention-days: 30
          if-no-files-found: ignore
      # ops-stack — OPS-SLO-006, OPS-OBS-*: Prometheus + Alertmanager THẬT (ghim sha256) — promtool check/test rules, scrape /api/metrics của bản
      # build production, rule diễn tập → Alertmanager → webhook cục bộ (firing rồi resolved). faithful-fixture, không phải production.
      - name: Cài Prometheus/promtool/Alertmanager/amtool (ghim sha256)
        if: ${{ !cancelled() }} # diễn tập độc lập: diễn tập trước đỏ vẫn chạy để thấy đủ kết quả (trước là job riêng)
        run: node scripts/tools/install-tool.mjs install prometheus promtool alertmanager amtool
      - name: Diễn tập giám sát end-to-end
        if: ${{ !cancelled() }} # diễn tập độc lập: diễn tập trước đỏ vẫn chạy để thấy đủ kết quả (trước là job riêng)
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_ops
          XC_REPORT_DIR: . # báo cáo ghi vào repo để upload artifact ở bước sau (mặc định ra thư mục tạm)
        run: npm run -s ops:stack:drill
      - name: Lưu báo cáo diễn tập
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-stack-drill
          path: |
            docs/ops/ops-stack-drill.md
            docs/ops/ops-stack-drill.json
          retention-days: 30
          if-no-files-found: ignore
      # staging-tls — SEC-WEB-001/004, BASE-SEC-004, PRF-WEB-009 (một phần): staging có TLS cục bộ — Caddy `tls internal` → bản build production;
      # kiểm TLS có xác minh chứng chỉ, http→https, header/cookie qua https, ZAP 2.17.0 (Java) baseline qua https + zap-gate.
      # faithful-fixture: CA nội bộ, không phải staging/production thật.
      - name: Cài Caddy (ghim sha512) và ZAP (ghim sha256)
        if: ${{ !cancelled() }} # diễn tập độc lập: diễn tập trước đỏ vẫn chạy để thấy đủ kết quả (trước là job riêng)
        run: node scripts/tools/install-tool.mjs install caddy zap
      - name: Staging TLS — Caddy + kiểm TLS/header/cookie + ZAP baseline qua https
        if: ${{ !cancelled() }} # diễn tập độc lập: diễn tập trước đỏ vẫn chạy để thấy đủ kết quả (trước là job riêng)
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xc_staging
          XC_REPORT_DIR: . # báo cáo ghi vào repo để upload artifact ở bước sau (mặc định ra thư mục tạm)
        run: npm run -s staging:drill
      - name: Lưu báo cáo staging TLS
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-tls-report
          path: |
            docs/security/staging-tls-report.md
            docs/security/staging-tls-report.json
            docs/security/staging-zap-baseline.json
          retention-days: 30
          if-no-files-found: ignore

  # Required check `quality` (ruleset `.github/rulesets/main.json`, cùng `gitleaks`): job TỔNG HỢP của MỌI job ở trên
  # (WF-CI-001, ADR-0039).
  # `always()` — không phải `!cancelled()`: run bị huỷ thì `quality` vẫn chạy và ĐỎ (job con `cancelled`/`skipped` ≠ `success`);
  # `skipped` của required check được GitHub tính là ĐẠT nên không được để `quality` thành `skipped`.
  quality:
    name: quality
    needs: [gate, test, e2e, readme-smoke, lighthouse, dast, drills]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi job con phải `success`
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: v.get("result") for job, v in needs.items() if v.get("result") != "success"}
          for job, v in sorted(needs.items()):
              print(f"{job}={v.get('result')}")
          if not needs or bad:
              print(f"::error::Job con không `success`: {bad or 'không có job con nào'}")
              sys.exit(1)
          PY
