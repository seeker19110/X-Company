name: OSV-Scanner

# SEC-SUPPLY-006, BASE-DEP-004: quét package-lock.json GỒM phụ thuộc dev trên mỗi PR + lịch tuần.
# Ngoại lệ có hạn: osv-scanner.toml (reason + ignoreUntil); quá hạn → bước kiểm hạn đỏ. dep-audit.yml (npm audit --omit=dev) giữ nguyên.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Ngoại lệ osv-scanner.toml còn hạn
        run: node scripts/check-osv-exceptions.mjs
      - name: Quét lockfile (prod + dev) theo osv-scanner.toml
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
