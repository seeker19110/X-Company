version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Nâng SHA của action đã ghim (uses: owner/repo@<sha> # vX.Y.Z) — giữ comment tag đồng bộ.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
