version: 2
updates:
  # Nâng SHA của action đã ghim (uses: owner/repo@<sha> # vX.Y.Z); gom nhóm để không phình WIP.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  # Phụ thuộc npm (package-lock.json) — production và dev tách nhóm, mỗi tuần.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development
    ignore:
      # typescript 7 vỡ peer của typescript-eslint 8 (npm ci đỏ trên main sau #6) — gỡ khi typescript-eslint hỗ trợ TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
