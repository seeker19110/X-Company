version: 2
updates:
  # Nâng SHA của action đã ghim (uses: owner/repo@<sha> # vX.Y.Z); gom nhóm để không phình WIP.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  # Phụ thuộc npm (package-lock.json) — production và dev tách nhóm, mỗi tuần.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x khai peer typescript ">=4.8.4 <6.1.0": nâng TS ≥ 6.1 làm `npm ci` lỗi ERESOLVE (đã xảy ra
      # với #6 — TS 7.0.2). Bỏ dòng này khi typescript-eslint hỗ trợ TS mới; nâng hai gói cùng một PR.
      - dependency-name: typescript
        versions: [">=6.1.0"]
