# Cấu hình ruff duy nhất của repo (lint + format). Chỉ bật luật bắt lỗi thật; thêm luật phải qua PR có lý do.
line-length = 120
target-version = "py311"

[lint]
# C901: độ phức tạp vòng ≤ 10 (AUD-CODE-001) — hàm vượt thì tách theo trách nhiệm, không `noqa`, không nới ngưỡng.
select = ["E9", "F", "C901"]

[lint.mccabe]
max-complexity = 10
